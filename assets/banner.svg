<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Animations */
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .floating-card-1 {
      animation: float-slow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card-2 {
      animation: float-slow 8s ease-in-out infinite 1s;
      transform-origin: center;
    }
    .bg-pulse {
      animation: pulse-glow 5s ease-in-out infinite;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash-flow 2s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Ambient Lights in Background -->
  <circle cx="200" cy="100" r="180" fill="#3b82f6" opacity="0.15" class="bg-pulse" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="220" fill="#8b5cf6" opacity="0.15" class="bg-pulse" filter="url(#glow)" />

  <!-- Dynamic Graphic / Network Flow Elements (In Background Behind Text) -->
  <g opacity="0.25">
    <!-- Grid Lines -->
    <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200" stroke="#334155" stroke-width="1" />
    <path d="M 300 0 V 400 M 600 0 V 400 M 900 0 V 400" stroke="#334155" stroke-width="1" />

    <!-- Connection Flow Paths -->
    <path d="M 150 320 C 350 220, 450 360, 650 280 S 950 350, 1080 260" fill="none" stroke="#6366f1" stroke-width="3" class="flow-line" />
    <path d="M 100 120 C 300 250, 500 150, 750 220 S 980 120, 1120 180" fill="none" stroke="#0ea5e9" stroke-width="2" class="flow-line" />
  </g>

  <!-- Animated Decorative Accent Cards (Positioned safely away from title) -->
  <g class="floating-card-1" opacity="0.4">
    <rect x="950" y="40" width="180" height="80" rx="12" fill="url(#accent-grad)" stroke="#6366f1" stroke-width="1" />
    <circle cx="980" cy="80" r="16" fill="#38bdf8" opacity="0.8" />
    <rect x="1010" y="68" width="90" height="8" rx="4" fill="#e2e8f0" opacity="0.7" />
    <rect x="1010" y="84" width="60" height="6" rx="3" fill="#94a3b8" opacity="0.5" />
  </g>

  <g class="floating-card-2" opacity="0.35">
    <rect x="70" y="270" width="160" height="75" rx="12" fill="url(#accent-grad)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="100" cy="307" r="14" fill="#22c55e" opacity="0.8" />
    <rect x="125" y="298" width="75" height="7" rx="3" fill="#e2e8f0" opacity="0.7" />
    <rect x="125" y="312" width="50" height="5" rx="2" fill="#94a3b8" opacity="0.5" />
  </g>

  <!-- Main Content Overlay (Foreground - Crystal Clear & Readable) -->
  <!-- Top Tag / Pill -->
  <g transform="translate(435, 50)">
    <rect width="330" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtle-glow)" />
    <text x="165" y="23" text-anchor="middle" class="badge-text">🏦 CURATED FINTECH &amp; KYC ECOSYSTEM</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(600, 165)" text-anchor="middle">
    <text y="0" class="title" filter="url(#subtle-glow)">Awesome Banking Customer Onboarding</text>
    <text y="48" class="subtitle">Identity Verification • eKYC/AML Compliance • Digital Account Opening</text>
  </g>

  <!-- Key Metrics / Feature Badges Row (Foreground Bottom) -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <!-- Sub-text list -->
    <text x="-260" y="0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">⚡ eKYC &amp; Biometrics</text>
    <circle cx="-160" cy="-5" r="3" fill="#38bdf8" />
    
    <text x="-60" y="0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">🛡️ AML &amp; Compliance</text>
    <circle cx="45" cy="-5" r="3" fill="#38bdf8" />

    <text x="150" y="0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">🌐 Core Banking &amp; SaaS</text>
    <circle cx="255" cy="-5" r="3" fill="#38bdf8" />

    <text x="350" y="0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">💻 Open-Source SDKs</text>
  </g>

  <!-- Outer Border Accent -->
  <rect width="1200" height="400" rx="16" fill="none" stroke="#334155" stroke-width="2" />
</svg>
